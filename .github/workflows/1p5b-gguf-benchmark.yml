name: Experimental 1.5B real GGUF pension corpus

concurrency:
  group: one-point-five-b-corpus-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/1p5b-gguf-benchmark.yml'
      - 'tests/real-corpus-benchmark.mjs'
      - 'src/chunkExtraction.ts'
      - 'src/sourceDateRestoration.ts'
      - 'src/dateRepresentation.ts'
      - 'src/App.tsx'

permissions:
  contents: read

jobs:
  real-1p5b-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test single-file offline application
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Install Chromium automation on networked CI runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Download and verify official Qwen 1.5B GGUF (CI only)
        timeout-minutes: 10
        run: |
          mkdir -p tmp
          curl -fL --retry 3 --retry-all-errors \
            'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf' \
            -o tmp/qwen2.5-1.5b-instruct-q4_k_m.gguf
          printf '%s  %s\n' \
            '6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e' \
            'tmp/qwen2.5-1.5b-instruct-q4_k_m.gguf' | sha256sum -c -
      - name: Measure all eight fictional pension cases in offline Chromium
        timeout-minutes: 35
        env:
          BENCHMARK_CASES: all
          CASE_TIMEOUT_MS: '300000'
          MODEL_LABEL: Official Qwen2.5-1.5B-Instruct Q4_K_M
          MODEL_FILE: tmp/qwen2.5-1.5b-instruct-q4_k_m.gguf
        run: node tests/real-corpus-benchmark.mjs
      - name: Upload fictional-only quality results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-case-real-1p5b-gguf-report
          path: |
            tmp/real-corpus-report.json
            tmp/real-corpus-final.png
          if-no-files-found: ignore
