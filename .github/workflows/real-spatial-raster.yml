name: Independent fictional raster-to-cell ground truth

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/real-spatial-raster.yml'
      - 'tests/real-spatial-raster-benchmark.mjs'
      - 'src/ocrWords.ts'
      - 'src/ocrSpatial.ts'

permissions:
  contents: read

jobs:
  raster-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned offline OCR dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright (CI only)
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure authentic Tesseract word boxes versus independent fictional image-cell annotations
        timeout-minutes: 10
        run: node --experimental-strip-types tests/real-spatial-raster-benchmark.mjs
      - name: Preserve bounded fictional pixel-region accuracy and abstention report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fictional-tesseract-raster-cell-accuracy
          path: tmp/spatial-raster-report.json
          if-no-files-found: ignore
