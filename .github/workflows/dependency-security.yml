name: Production dependency security audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-dependency-audit.mjs'
      - 'tests/dependencyAudit.test.mjs'
      - '.github/workflows/dependency-security.yml'

permissions:
  contents: read

jobs:
  audit-production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test audit integrity checks
        run: node --test tests/dependencyAudit.test.mjs
      - name: Audit only shipped production dependencies
        shell: bash
        run: |
          mkdir -p tmp
          set +e
          npm audit --omit=dev --audit-level=high --json > tmp/dependency-audit.json
          audit_exit=$?
          set -e
          node scripts/check-dependency-audit.mjs tmp/dependency-audit.json
          if [ "$audit_exit" -ne 0 ]; then
            echo "npm audit exited with code $audit_exit."
            exit "$audit_exit"
          fi
      - name: Upload machine-readable dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: tmp/dependency-audit.json
          if-no-files-found: ignore
